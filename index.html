<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dante Quotes</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap');


html,
body {

    margin: 0;
    padding: 0;

    background: transparent;

    color: white;

    font-family: 'Cinzel', Georgia, serif;

    overflow: hidden;

}


/*
   The box now wraps only the actual text.
   The iframe itself remains transparent.
*/

#dante-quote-box {

    display: inline-block;

    width: 100%;

    box-sizing: border-box;

    padding: 20px 28px;

    background: rgba(25, 35, 50, 0.7);

    border: 1px solid rgba(96, 112, 128, 0.8);

    border-radius: 15px;

    transition: opacity 0.7s ease;

}


/*
   Quote
*/

#dante-quote {

    margin: 0;

    text-align: left;

    font-size: 20px;

    line-height: 1.55;

    font-weight: 400;

    letter-spacing: 0.2px;

    text-shadow:
        1px 1px 3px rgba(0,0,0,0.9),
        0 0 6px rgba(0,0,0,0.7);

}


/*
   Character / Canto
   Always on its own line and right aligned.
*/

#dante-source {

    display: block;

    margin-top: 14px;

    text-align: right;

    font-size: 15px;

    line-height: 1.3;

    font-weight: 500;

    white-space: nowrap;

    text-shadow:
        1px 1px 3px rgba(0,0,0,0.9),
        0 0 5px rgba(0,0,0,0.7);

}


/*
   Fade animation
*/

#dante-quote-box.fade-out {

    opacity: 0;

}

#dante-quote-box.fade-in {

    opacity: 1;

}


/*
   Smaller screens
*/

@media (max-width: 700px) {

    #dante-quote-box {

        padding: 16px 20px;

    }


    #dante-quote {

        font-size: 17px;

        line-height: 1.5;

    }


    #dante-source {

        font-size: 13px;

        margin-top: 12px;

    }

}

</style>

</head>


<body>


<div id="dante-quote-box">

    <div id="dante-quote"></div>

    <div id="dante-source"></div>

</div>


<script>

let current = -1;


/*
   Pick a random quote.
   Prevents the same quote from appearing twice in a row.
*/

function showQuote() {

    let next;

    do {

        next =
            Math.floor(
                Math.random() * quotes.length
            );

    }
    while (
        next === current &&
        quotes.length > 1
    );


    current = next;


    const box =
        document.getElementById(
            "dante-quote-box"
        );

    const quote =
        document.getElementById(
            "dante-quote"
        );

    const source =
        document.getElementById(
            "dante-source"
        );


    /*
       Fade out
    */

    box.style.opacity = "0";


    setTimeout(function() {


        /*
           Change text
        */

        quote.textContent =
            quotes[current][0];

        source.textContent =
            quotes[current][1];


        /*
           Fade back in
        */

        box.style.opacity = "1";


        /*
           Tell parent the new height
        */

        sendHeight();


    }, 700);

}


/*
   Report the actual height of the
   quote box to the parent iframe.
*/

function sendHeight() {

    const box =
        document.getElementById(
            "dante-quote-box"
        );


    const height =
        box.getBoundingClientRect().height;


    window.parent.postMessage({

        type: "danteResize",

        height: Math.ceil(height)

    }, "*");

}


/*
   Start immediately
*/

showQuote();


/*
   Change quote every 15 seconds
*/

setInterval(function() {

    showQuote();

}, 15000);


/*
   Recalculate if the window changes size
*/

window.addEventListener(
    "resize",
    sendHeight
);


</script>

</body>

</html>
